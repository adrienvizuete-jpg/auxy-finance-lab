# CI Auxy Finance Lab — tests unitaires, typage, lint, E2E smoke
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qualite:
    name: Tests + typage + lint + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances (dev)
        run: npm ci

      - name: Tests unitaires (moteurs)
        run: npm test

      - name: Typage (tsc --checkJs, mode strict)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: E2E smoke (Chrome headless)
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Compilation Python veille
        run: python3 -m py_compile veille/*.py
