name: Keepalive — anti auto-désactivation

# ─────────────────────────────────────────────────────────────────────────────
# Pourquoi ce workflow ?
# GitHub désactive automatiquement TOUS les workflows planifiés d'un repo après
# 60 jours sans commit sur la branche par défaut. C'est ce qui a coupé la veille
# « Daily Market Intelligence » le 27/05/2026 (dernier commit le 27/03).
#
# Ce job tourne chaque lundi et, UNIQUEMENT si le dernier commit date de ≥ 45
# jours, pousse un commit vide. Cela réinitialise le compteur d'inactivité et
# maintient la veille quotidienne active — sans dépendance à une action tierce
# (auditable, aucun secret supplémentaire requis).
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '23 5 * * 1'   # tous les lundis ~5h23 UTC (heure creuse, hors :00/:30)
  workflow_dispatch:        # déclenchement manuel possible

permissions:
  contents: write           # nécessaire pour pousser le commit keepalive

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Commit léger si le repo approche 60 j d'inactivité
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Dernier commit il y a ${days} jour(s)."
          if [ "${days}" -ge 45 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore(keepalive): réinitialise le compteur d'inactivité GitHub Actions"
            git push
            echo "✅ Commit keepalive poussé — workflows planifiés maintenus actifs."
          else
            echo "Rien à faire (< 45 j depuis le dernier commit)."
          fi
